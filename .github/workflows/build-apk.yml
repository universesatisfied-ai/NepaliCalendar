name: Build Nepali Calendar APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project
        shell: bash
        run: |
          set -e

          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          SETTINGS_FILE=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            find project -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Fix Kotlin version
        shell: bash
        run: |
          set -e

          echo "========== ORIGINAL BUILD.GRADLE =========="
          cat "$PROJECT_DIR/build.gradle"
          echo "==========================================="

          python3 <<'PY'
          import os
          import re

          project_dir = os.environ["PROJECT_DIR"]
          path = os.path.join(project_dir, "build.gradle")

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Replace any Kotlin Android plugin version with 2.0.21.
          text = re.sub(
              r"(id\s*:\s*['\"]org\.jetbrains\.kotlin\.android['\"]\s*,\s*version\s*:\s*['\"])[^'\"]+(['\"])",
              r"\g<1>2.0.21\g<2>",
              text
          )

          # Also handle the common plugins DSL form.
          text = re.sub(
              r"(id\s*\(\s*['\"]org\.jetbrains\.kotlin\.android['\"]\s*\)\s*version\s*['\"])[^'\"]+(['\"])",
              r"\g<1>2.0.21\g<2>",
              text
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Kotlin version patched.")
          PY

          echo "========== UPDATED BUILD.GRADLE =========="
          cat "$PROJECT_DIR/build.gradle"
          echo "==========================================="

      - name: Verify Kotlin version
        shell: bash
        run: |
          set -e

          if grep -q "1.9.2" "$PROJECT_DIR/build.gradle"; then
            echo "ERROR: Kotlin 1.9.2 is still present."
            exit 1
          fi

          echo "Kotlin 1.9.2 is NOT present."

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "Starting Android build..."

          gradle \
            -p "$PROJECT_DIR" \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nepali-Calendar-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
