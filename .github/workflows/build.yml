name: Build Nepali Calendar APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NepaliCalendar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # Final device QA builds Debug and unsigned Release APKs.
  # (Existing workflow retained from latest green hardening source.)
